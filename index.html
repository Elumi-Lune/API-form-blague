<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Librairie CSS demandée dans le TP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">

    <title>JokeAPI</title>
</head>
<body class="bg-light">

    <main class="container py-4">
        <h1 class="mb-4">Blagues JokeAPI</h1>

        <form id="joke-form" class="card card-body mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="categorie" class="form-label">Catégorie</label>
                    <select id="categorie" class="form-select">
                        <option value="Any">Toutes</option>
                        <option value="Programming">Programming</option>
                        <option value="Misc">Misc</option>
                        <option value="Pun">Pun</option>
                        <option value="Spooky">Spooky</option>
                        <option value="Christmas">Christmas</option>
                    </select>
                </div>

                <div class="col-md-7 d-flex gap-2 flex-wrap">
                    <button type="submit" id="btn-add" class="btn btn-primary">
                        Ajouter une blague
                    </button>
                    <button type="button" id="btn-clear" class="btn btn-danger">
                        Vider le tableau
                    </button>
                </div>
            </div>
        </form>

        <div class="table-responsive">
            <table id="table" class="table table-striped table-bordered align-middle"></table>
        </div>
    </main>

    <script src="./assets/js/app.js"></script>
</body>
</html>
